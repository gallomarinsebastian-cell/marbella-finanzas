<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Marbella Finanzas</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:720px;margin:auto;padding-bottom:90px}.top{padding:22px 18px 10px;background:white;position:sticky;top:0;z-index:5;border-bottom:1px solid #e5e7eb}
.brand{font-size:25px;font-weight:800}.sub{color:#6b7280;font-size:13px;margin-top:3px}.tabs{display:flex;gap:8px;margin-top:16px}.tab{flex:1;border:1px solid #e5e7eb;background:white;padding:10px;border-radius:12px}.tab.active{background:#111827;color:white}
.content{padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:16px;box-shadow:0 2px 8px #00000008}
.label{font-size:12px;color:#6b7280}.amount{font-size:22px;font-weight:800;margin-top:5px}.green{color:#16803c}.red{color:#c62828}
.section{margin-top:16px}.section h2{font-size:17px;margin:0 0 10px}.form{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:12px;background:white;font:inherit}.primary{border:0;background:#111827;color:white;border-radius:12px;padding:13px;font-weight:700}
.list{display:grid;gap:9px}.item{display:flex;justify-content:space-between;gap:10px;background:white;border:1px solid #e5e7eb;border-radius:14px;padding:12px}.meta{font-size:12px;color:#6b7280;margin-top:3px}
.delete{border:0;background:#fee2e2;color:#991b1b;border-radius:9px;padding:7px 9px}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e5e7eb;padding:10px}.bottom-inner{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nav{border:0;background:white;color:#6b7280;padding:8px;border-radius:10px}.nav.active{background:#eef2ff;color:#111827;font-weight:700}.hidden{display:none}.empty{text-align:center;color:#6b7280;padding:20px}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div class="brand">Marbella Finanzas</div>
<div class="sub">Control sencillo de tus finanzas</div>
<div class="tabs">
<button class="tab active" data-area="negocio">🏪 Negocio</button>
<button class="tab" data-area="personal">👤 Personal</button>
</div>
</header>
<main class="content">
<section id="dashboard">
<div class="grid">
<div class="card"><div class="label">Ingresos</div><div id="income" class="amount green">$0</div></div>
<div class="card"><div class="label">Gastos</div><div id="expense" class="amount red">$0</div></div>
<div class="card"><div class="label">Balance</div><div id="balance" class="amount">$0</div></div>
<div class="card"><div class="label">Movimientos</div><div id="count" class="amount">0</div></div>
</div>
<div class="section card">
<h2>Registrar movimiento</h2>
<form id="form" class="form">
<div class="row"><select id="type"><option value="gasto">Gasto</option><option value="ingreso">Ingreso</option></select><input id="amount" type="number" min="0" step="1" placeholder="Valor" required></div>
<div class="row"><select id="category"></select><input id="description" maxlength="80" placeholder="Descripción" required></div>
<div class="row"><input id="date" type="date" required><select id="payment"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta débito</option><option>Tarjeta crédito</option><option>Nequi</option><option>Otro</option></select></div>
<button class="primary">Guardar movimiento</button>
</form>
</div>
<div class="section card"><h2>Resumen del mes</h2><div id="monthSummary"></div></div>
</section>
<section id="movements" class="hidden">
<div class="card"><h2>Movimientos</h2><div class="row"><input id="search" placeholder="Buscar..."><select id="filter"><option value="todos">Todos</option><option value="gasto">Gastos</option><option value="ingreso">Ingresos</option></select></div></div>
<div id="list" class="list section"></div>
</section>
<section id="settings" class="hidden">
<div class="card"><h2>Configuración</h2><p>Los movimientos se guardan en este dispositivo.</p>
<button id="export" class="primary">Exportar datos</button><br><br><button id="clear" class="delete">Borrar datos</button></div>
</section>
</main>
</div>
<nav class="bottom"><div class="bottom-inner">
<button class="nav active" data-page="dashboard">📊 Resumen</button>
<button class="nav" data-page="movements">📋 Movimientos</button>
<button class="nav" data-page="settings">⚙️ Configuración</button>
</div></nav>
<script>
const KEY="marbella-finanzas-v1";
let data=JSON.parse(localStorage.getItem(KEY)||'{"negocio":[],"personal":[]}'),area="negocio";
const cats={negocio:["Mercancía","Arriendo","Servicios","Nómina","Transporte","Impuestos","Mantenimiento","Equipos","Domicilios","Otros"],personal:["Vivienda","Alimentación","Transporte","Salud","Educación","Deudas","Compras","Entretenimiento","Ahorro","Otros"]};
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n||0);
const today=()=>new Date().toISOString().slice(0,10);
$("date").value=today();
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function setCats(){$("category").innerHTML=cats[area].map(x=>`<option>${x}</option>`).join("")}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]))}
function render(){
 let a=data[area],inc=a.filter(x=>x.type=="ingreso").reduce((s,x)=>s+x.amount,0),exp=a.filter(x=>x.type=="gasto").reduce((s,x)=>s+x.amount,0);
 $("income").textContent=money(inc);$("expense").textContent=money(exp);$("balance").textContent=money(inc-exp);$("count").textContent=a.length;
 let m=today().slice(0,7),mm=a.filter(x=>x.date.startsWith(m)),mi=mm.filter(x=>x.type=="ingreso").reduce((s,x)=>s+x.amount,0),me=mm.filter(x=>x.type=="gasto").reduce((s,x)=>s+x.amount,0);
 $("monthSummary").textContent=`Este mes: ${money(mi)} ingresos · ${money(me)} gastos · balance ${money(mi-me)}`;
 renderList();
}
function renderList(){
 let q=($("search").value||"").toLowerCase(),f=$("filter").value,a=[...data[area]].reverse().filter(x=>(f=="todos"||x.type==f)&&(x.description+" "+x.category+" "+x.payment).toLowerCase().includes(q));
 $("list").innerHTML=a.length?a.map(x=>`<div class="item"><div><b>${esc(x.description)}</b><div class="meta">${esc(x.category)} · ${esc(x.payment)} · ${x.date}</div></div><div style="text-align:right"><div class="${x.type=="ingreso"?"green":"red"}"><b>${x.type=="ingreso"?"+":"-"}${money(x.amount)}</b></div><button class="delete" onclick="del('${x.id}')">Eliminar</button></div></div>`).join(""):'<div class="empty">No hay movimientos para mostrar.</div>';
}
window.del=id=>{data[area]=data[area].filter(x=>x.id!==id);save();render()};
$("form").onsubmit=e=>{e.preventDefault();data[area].push({id:crypto.randomUUID(),type:$("type").value,amount:Number($("amount").value),category:$("category").value,description:$("description").value.trim(),date:$("date").value,payment:$("payment").value});save();e.target.reset();$("date").value=today();render();alert("Movimiento guardado")};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{area=b.dataset.area;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x==b));setCats();render()});
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{let p=b.dataset.page;document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x==b));["dashboard","movements","settings"].forEach(x=>$(x).classList.toggle("hidden",x!=p));renderList()});
$("search").oninput=renderList;$("filter").onchange=renderList;
$("export").onclick=()=>{let blob=new Blob([JSON.stringify(data[area],null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`marbella-${area}.json`;a.click()};
$("clear").onclick=()=>{if(confirm("¿Borrar todos los movimientos de esta área?")){data[area]=[];save();render()}};
setCats();render();
</script>
</body>
</html>
